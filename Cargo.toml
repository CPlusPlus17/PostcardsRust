[workspace]
resolver = "2"
members = [
    "postcards-rust-core",
    "postcards-rust-api",
    "postcards-rust-plugin-base",
    "postcards-rust-plugin-google-photos",
    "postcards-rust-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["CPlusPlus17"]
repository = "https://github.com/CPlusPlus17/PostcardsRust"
rust-version = "1.97"

[workspace.dependencies]
# internal
postcards-rust-core = { path = "postcards-rust-core" }
postcards-rust-api = { path = "postcards-rust-api" }
postcards-rust-plugin-base = { path = "postcards-rust-plugin-base" }
postcards-rust-plugin-google-photos = { path = "postcards-rust-plugin-google-photos" }

# async
tokio = { version = "1", features = ["full"] }

# http
reqwest = { version = "0.12", default-features = false, features = [
    "native-tls",
    "cookies",
    "json",
    "gzip",
    "multipart",
] }
# curl crate: linked against the SYSTEM libcurl 8.18 (via PKG_CONFIG shim)
# because its ClientHello passes the swissid WAF. reqwest (native-tls/rustls)
# is reset mid-handshake. See postcards-rust-core/src/swissid.rs.
curl = "0.4"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["rustls"] }

# image
image = { version = "0.25", features = ["jpeg", "png"] }
base64 = "0.22"

# crypto / misc
rand = "0.9"
sha2 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde"] }
urlencoding = "2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
regex = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures = "0.3"
async-trait = "0.1"
walkdir = "2"
once_cell = "1"

[profile.release]
lto = "thin"
strip = "debuginfo"
codegen-units = 1
